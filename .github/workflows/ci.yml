name: CI

on:
  push:
    branches: [main, work/forgedeps-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariaagent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORGEDEPS_HOME: ${{ github.workspace }}/.forgedeps
  # Candidate source is explicit; published dependency locks remain unchanged.
  # The reviewed Aria source is the released tag the dependency lock names.
  ARIA_SDK_SOURCE: ${{ github.workspace }}/build/aria-candidate
  GCC_VERSION: "16"
  LLVM_VERSION: "23"
  PYTHON_VERSION: "3.14"

jobs:
  dependency-contracts:
    name: Dependency contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.1
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: python -m forgedeps init .forgedeps
      - name: Verify selection, rollback and cache contracts
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'

  vs2026:
    name: Qt desktop (VS2026 MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.1
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: python -m forgedeps init .forgedeps
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
      - name: Verify OpenSSL build tools
        run: Get-Command cl, nmake, perl, nasm -ErrorAction Stop
      - name: Configure and build with Visual Studio 2026
        run: |
          python scripts/build.py --build-dir build/ci-vs2026 --generator "Visual Studio 18 2026" --generator-platform x64 --jobs 3
      - name: Run regression tests
        run: python -m forgedeps.build_kit.session --build-dir build/ci-vs2026 -- ctest --test-dir build/ci-vs2026 -C Release --output-on-failure --no-tests=error

  windows:
    name: Qt desktop (Windows UCRT64)
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.1
          path: build/aria-candidate
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            make
            perl
            git
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: python -m forgedeps init .forgedeps
      - name: Configure and build desktop application
        run: |
          python -m forgedeps.build_kit.session --configure -- cmake -S . -B build/ci-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DARIA_TARGET_QT=ON
          python -m forgedeps.build_kit.session --build-dir build/ci-win -- cmake --build build/ci-win --parallel 3
      - name: Run regression tests
        run: python -m forgedeps.build_kit.session --build-dir build/ci-win -- ctest --test-dir build/ci-win --output-on-failure --no-tests=error

  desktop:
    name: Qt desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, container: gcc:16 }
          - { os: xcode-27 }
    container:
      image: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up GCC 16, Python, Qt and OpenSSL
        if: matrix.container
        run: .github/scripts/setup-gcc-container.sh qt6-base-dev libssl-dev

      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.1
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: python -m forgedeps init .forgedeps

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja qt openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          python -m forgedeps.build_kit.session --configure -- cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}" \
            -DARIA_TARGET_QT=ON

      - name: Build desktop application
        run: python -m forgedeps.build_kit.session --build-dir build/ci -- cmake --build build/ci --parallel 3

      - name: Run regression tests
        run: python -m forgedeps.build_kit.session --build-dir build/ci -- ctest --test-dir build/ci --output-on-failure --no-tests=error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ariaagent-diagnostics-${{ matrix.os }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
