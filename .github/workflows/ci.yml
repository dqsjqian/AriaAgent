name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariaagent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-contracts:
    name: Dependency contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Verify selection, rollback and cache contracts
        run: python -m unittest discover -s tools/ci -p 'test_*.py'

  vs2026:
    name: Qt desktop (VS2026 MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
      - name: Verify OpenSSL build tools
        run: Get-Command cl, nmake, perl, nasm -ErrorAction Stop
      - name: Configure and build with Visual Studio 2026
        run: |
          python tools/build.py --build-dir build/ci-vs2026 --generator "Visual Studio 18 2026" --jobs 3 --cmake-arg=-A --cmake-arg=x64
      - name: Run regression tests
        run: ctest --test-dir build/ci-vs2026 -C Release --output-on-failure --no-tests=error

  windows:
    name: Qt desktop (Windows UCRT64)
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-python
            make
            perl
            git
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py
      - name: Configure and build desktop application
        run: |
          cmake -S . -B build/ci-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DARIA_TARGET_QT=ON
          cmake --build build/ci-win --parallel 3
      - name: Run regression tests
        run: ctest --test-dir build/ci-win --output-on-failure --no-tests=error

  desktop:
    name: Qt desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 qt6-base-dev libssl-dev
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja qt openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}" \
            -DARIA_TARGET_QT=ON

      - name: Build desktop application
        run: cmake --build build/ci --parallel 3

      - name: Run regression tests
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ariaagent-diagnostics-${{ matrix.os }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
