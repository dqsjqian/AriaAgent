<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="640" y="74" text-anchor="middle" fill="#f8fafc" font-size="44" font-weight="700">AriaAgent · C++20 Agent 工具框架 GUI</text>
  <text x="640" y="118" text-anchor="middle" fill="#94a3b8" font-size="24">Provider 无关 · 真流式 SSE · 工具调用链可视化 · 权限审批</text>

  <g filter="url(#sh)">
    <rect x="60" y="160" width="560" height="210" rx="18" fill="url(#a2)"/>
    <text x="340" y="200" text-anchor="middle" fill="#083344" font-size="26" font-weight="700">引擎层 core/agent（纯 C++，零 Qt 依赖）</text>
    <g text-anchor="middle" fill="#083344" font-size="20">
      <text x="340" y="248">Agent 循环：思考 → 调工具 → 观察 → 再思考</text>
      <text x="340" y="282">C++20 协程实现 · 工具有界并行</text>
      <text x="340" y="316">LlmClient 抽象 + OpenAiCompatClient</text>
      <text x="340" y="350">工具注册表：Tool{name, desc, schema, fn}</text>
    </g>
  </g>

  <g filter="url(#sh)">
    <rect x="660" y="160" width="560" height="210" rx="18" fill="url(#a1)"/>
    <text x="940" y="200" text-anchor="middle" fill="#faf5ff" font-size="26" font-weight="700">UI 层（Aria 响应式驱动）</text>
    <g text-anchor="middle" fill="#ede9fe" font-size="20">
      <text x="940" y="248">多会话侧边栏 · JSON 持久化自动恢复</text>
      <text x="940" y="282">Markdown 气泡 + 代码高亮</text>
      <text x="940" y="316">工具调用轨迹面板（成功/失败着色）</text>
      <text x="940" y="350">Todo 面板 · 消息 👍/👎</text>
    </g>
  </g>

  <g filter="url(#sh)">
    <rect x="60" y="410" width="1160" height="120" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="640" y="450" text-anchor="middle" fill="#e2e8f0" font-size="25" font-weight="600">Agent ↔ 模型：token 级真流式 SSE</text>
    <text x="640" y="492" text-anchor="middle" fill="#94a3b8" font-size="20">cpp-httplib ContentReceiver 逐 token 渲染 · 不是缓冲式假流式</text>
  </g>

  <g filter="url(#sh)">
    <rect x="60" y="570" width="1160" height="105" rx="18" fill="#7c2d12" stroke="#ea580c"/>
    <text x="640" y="608" text-anchor="middle" fill="#fdba74" font-size="25" font-weight="600">安全默认：fail-closed 权限审批</text>
    <text x="640" y="650" text-anchor="middle" fill="#fed7aa" font-size="20">run_command / 写文件 / 后台进程 → 模态确认，默认拒绝 · 防目录逃逸</text>
  </g>
</svg>
